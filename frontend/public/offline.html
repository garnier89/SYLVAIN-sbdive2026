<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SB Drive — Hors ligne</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(135deg,#FF4500 0%,#e63d00 100%);color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center}
    .wrap{max-width:380px}
    .icon{width:96px;height:96px;margin:0 auto 24px;background:rgba(255,255,255,.18);border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:48px}
    h1{font-size:28px;font-weight:800;margin-bottom:12px;letter-spacing:-.02em}
    p{font-size:15px;opacity:.9;line-height:1.55;margin-bottom:28px}
    button{background:#fff;color:#FF4500;border:0;padding:14px 28px;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;transition:transform .15s}
    button:active{transform:scale(.96)}
    .hint{margin-top:24px;font-size:12px;opacity:.7}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="icon">📡</div>
    <h1>Vous êtes hors ligne</h1>
    <p>Pas d'inquiétude — vos courses récentes et votre wallet restent consultables. Reconnectez-vous pour réserver une nouvelle course.</p>
    <button onclick="window.location.reload()">Réessayer</button>
    <div class="hint">SB Drive · Mode hors ligne</div>
  </div>
  <script>
    // Auto-retry when connection comes back
    window.addEventListener('online', () => window.location.reload());
  </script>
</body>
</html>
